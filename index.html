<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM Amig.IA Educação</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8">
  <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-md p-6">
    <div class="flex items-center justify-between border-b pb-4 mb-6">
      <h1 class="text-2xl font-bold text-slate-800">CRM Amig.IA — Gestão de Leads</h1>
      <button onclick="carregarLeads()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1.5 rounded-lg text-sm transition">
        🔄 Atualizar Lista
      </button>
    </div>

    <!-- Seletor de Lead Existente -->
    <div class="mb-6 bg-slate-50 p-4 rounded-lg border border-slate-200">
      <label class="block text-sm font-semibold text-slate-700 mb-2">Buscar Lead para Atualizar:</label>
      <select id="selectLead" onchange="preencherFormularioComLeadExistente()" class="w-full border-slate-300 rounded-lg shadow-sm p-2 bg-white border">
        <option value="">-- Cadastrar Novo Lead --</option>
      </select>
    </div>

    <!-- Formulário do Lead -->
    <form id="crmForm" onsubmit="salvarLead(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-semibold text-slate-600 uppercase">Unidade / Nome da Escola *</label>
        <input type="text" id="Unidade" required class="w-full border rounded-lg p-2 mt-1 text-sm border-slate-300">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 uppercase">Segmento</label>
        <input type="text" id="Segmento" value="Educação" class="w-full border rounded-lg p-2 mt-1 text-sm border-slate-300">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 uppercase">Nome do Responsável</label>
        <input type="text" id="Nome do responsável" class="w-full border rounded-lg p-2 mt-1 text-sm border-slate-300">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 uppercase">Cargo</label>
        <input type="text" id="Cargo" class="w-full border rounded-lg p-2 mt-1 text-sm border-slate-300">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 uppercase">Modalidade</label>
        <select id="Modalidade" class="w-full border rounded-lg p-2 mt-1 text-sm border-slate-300">
          <option value="Particular">Particular</option>
          <option value="Pública">Pública</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 uppercase">Município</label>
        <input type="text" id="Município" class="w-full border rounded-lg p-2 mt-1 text-sm border-slate-300">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 uppercase">Telefone / WhatsApp</label>
        <input type="text" id="Telefone/WhatsApp" class="w-full border rounded-lg p-2 mt-1 text-sm border-slate-300">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 uppercase">E-mail</label>
        <input type="email" id="E-mail" class="w-full border rounded-lg p-2 mt-1 text-sm border-slate-300">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 uppercase">Status da Prospecção</label>
        <select id="Status" class="w-full border rounded-lg p-2 mt-1 text-sm border-slate-300 font-semibold text-blue-600">
          <option value="Não iniciado">Não iniciado</option>
          <option value="Mensagem Enviada">Mensagem Enviada</option>
          <option value="Em andamento">Em andamento</option>
          <option value="Reunião Agendada">Reunião Agendada</option>
          <option value="Proposta enviada">Proposta enviada</option>
          <option value="Fechado">Fechado</option>
          <option value="Perdido">Perdido</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 uppercase">Potencial</label>
        <select id="Potencial" class="w-full border rounded-lg p-2 mt-1 text-sm border-slate-300">
          <option value="Grande">Grande</option>
          <option value="Médio">Médio</option>
          <option value="Baixo">Baixo</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 uppercase">Reunião Realizada?</label>
        <select id="Reunião Realizada?" class="w-full border rounded-lg p-2 mt-1 text-sm border-slate-300">
          <option value="Não">Não</option>
          <option value="Sim">Sim</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 uppercase">Origem do Lead</label>
        <input type="text" id="Origem do lead" value="Google Maps" class="w-full border rounded-lg p-2 mt-1 text-sm border-slate-300">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 uppercase">Instagram</label>
        <input type="text" id="Instagram" class="w-full border rounded-lg p-2 mt-1 text-sm border-slate-300">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 uppercase">Site</label>
        <input type="text" id="Site" class="w-full border rounded-lg p-2 mt-1 text-sm border-slate-300">
      </div>

      <div class="md:col-span-2">
        <label class="block text-xs font-semibold text-slate-600 uppercase">Endereço Completo</label>
        <input type="text" id="Endereço" class="w-full border rounded-lg p-2 mt-1 text-sm border-slate-300">
      </div>

      <div class="md:col-span-2">
        <label class="block text-xs font-semibold text-slate-600 uppercase">Observações / Histórico de Interações</label>
        <textarea id="Observações" rows="3" class="w-full border rounded-lg p-2 mt-1 text-sm border-slate-300"></textarea>
      </div>

      <div class="md:col-span-2 mt-4">
        <button type="submit" id="btnSalvar" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow-lg transition">
          💾 Salvar / Atualizar Lead
        </button>
      </div>
    </form>
  </div>

  <script>
    // Cole aqui a URL do seu Apps Script (obtida no Passo 1)
    const API_URL = "https://script.google.com/macros/s/AKfycbxabtEapcy0UpIpY8U0Kjl2FzUnQniJzX5gmiEDz0q2qi7djmMAGDJWS0yfwq0NYsCSDA/exec";
    let leadsCache = [];

    async function carregarLeads() {
      try {
        const res = await fetch(API_URL);
        leadsCache = await res.json();
        const select = document.getElementById('selectLead');
        select.innerHTML = '<option value="">-- Cadastrar Novo Lead --</option>';
        
        leadsCache.forEach(lead => {
          if (lead.Unidade) {
            const opt = document.createElement('option');
            opt.value = lead.Unidade;
            opt.textContent = `${lead.Unidade} (${lead.Status || 'Sem status'})`;
            select.appendChild(opt);
          }
        });
      } catch (err) {
        console.error("Erro ao carregar leads:", err);
      }
    }

    function preencherFormularioComLeadExistente() {
      const selectedUnidade = document.getElementById('selectLead').value;
      const form = document.getElementById('crmForm');
      
      if (!selectedUnidade) {
        form.reset();
        return;
      }

      const lead = leadsCache.find(l => l.Unidade === selectedUnidade);
      if (lead) {
        Object.keys(lead).forEach(key => {
          const field = document.getElementById(key);
          if (field) field.value = lead[key] || '';
        });
      }
    }

    async function salvarLead(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSalvar');
      btn.disabled = true;
      btn.textContent = "⏳ Salvando...";

      const fields = [
        "Unidade", "Segmento", "Nome do responsável", "Cargo", "Modalidade",
        "Município", "Telefone/WhatsApp", "E-mail", "Instagram", "Site",
        "Endereço", "Serviço recomendado", "Origem do lead", "Status",
        "Reunião Realizada?", "Potencial", "Avaliação Google", "Data de Contato via e-mail",
        "Recontato", "Mensagem na Rede Social via", "Observações", "Visitado"
      ];

      const payload = {};
      fields.forEach(field => {
        const el = document.getElementById(field);
        payload[field] = el ? el.value : '';
      });

      try {
        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        alert("✅ Lead salvo/atualizado com sucesso!");
        document.getElementById('crmForm').reset();
        carregarLeads();
      } catch (err) {
        alert("❌ Erro ao salvar o lead: " + err);
      } finally {
        btn.disabled = false;
        btn.textContent = "💾 Salvar / Atualizar Lead";
      }
    }

    // Carrega a lista de escolas ao abrir o site
    window.onload = carregarLeads;
  </script>
</body>
</html>
